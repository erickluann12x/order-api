spring.application.name=order-api


# ===============================
# AWS S3
# ===============================

aws.accessKey=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.bucket=${AWS_BUCKET}


# ===============================
# JWT
# ===============================

# Access token: por exemplo, 15 minutos em milissegundos
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# Refresh token: por exemplo, 7 dias em milissegundos
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}


# ===============================
# FRONTEND E CORS
# ===============================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# ===============================
# COOKIE DO REFRESH TOKEN
# ===============================

security.cookie.secure=${SECURITY_COOKIE_SECURE:false}
security.cookie.same-site=${SECURITY_COOKIE_SAME_SITE:Lax}


# ===============================
# POSTGRESQL
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# HIKARI CONNECTION POOL
# ===============================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Opcional no Spring Boot 3 / Hibernate 6
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# UPLOAD DE FOTOS
# ===============================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===============================
# SERVIDOR / RENDER
# ===============================

server.port=${PORT:8080}
server.forward-headers-strategy=framework


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true